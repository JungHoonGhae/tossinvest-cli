name: Repository Metadata

# One daily PR for statistics, charts, and sponsor attribution.
# Downloads remain sampled daily; pending PRs retain previous observations.
on:
  schedule:
    - cron: '17 23 * * *' # 08:17 KST
  workflow_dispatch:

# Least privilege by default: collection parses third-party pages and API
# responses and must never hold a writable token. The publish job below
# raises its own permissions.
permissions:
  contents: read

concurrency:
  group: automation-repository-metadata
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout + gh pr list in the prepare step
      pull-requests: read # gh pr list in the prepare step
      actions: write # upload-artifact handoff to the publish job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Reuse pending maintenance PR before generating
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/open_automation_pr.sh --prepare automation/repository-metadata
      - name: Update daily statistics and star charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/update_stats.py
          python3 tools/gen_star_history.py
      - name: Refresh sponsor attribution when configured
        env:
          GH_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            python3 tools/sponsors.py
          else
            echo "SPONSORS_TOKEN not configured; preserving existing attribution."
          fi
      - name: Hand off to publish job
        # Every file the publish commit may touch (see validate_files in
        # tools/open_automation_pr.sh) travels in one tarball.
        run: |
          tar -czf /tmp/repo-metadata-collect.tar.gz -C "$GITHUB_WORKSPACE" \
            STATS.md docs/.stats-downloads.json docs/assets/star-history/star-history-v2-dark.svg docs/assets/star-history/star-history-v2-light.svg README.md README.en.md
      - name: Upload handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-metadata-collect
          path: /tmp/repo-metadata-collect.tar.gz
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push updated docs
      pull-requests: write # open/update automation PR
      actions: read # download-artifact only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reuse pending maintenance PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/open_automation_pr.sh --prepare automation/repository-metadata
      - name: Download handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repository-metadata-collect
          path: /tmp/repo-handoff
      - name: Restore generated files
        run: tar -xzf /tmp/repo-handoff/repo-metadata-collect.tar.gz -C "$GITHUB_WORKSPACE"
      - name: Publish one protected maintenance PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add STATS.md docs/.stats-downloads.json docs/assets/star-history README.md README.en.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(metadata): 통계·스타 차트·후원자 갱신"
          fi
          bash tools/open_automation_pr.sh automation/repository-metadata \
            "chore(metadata): 통계·스타 차트·후원자 갱신"
