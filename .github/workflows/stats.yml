name: Stats

on:
  schedule:
    - cron: '0 23 * * *' # daily, ~08:00 KST
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Update STATS.md (stars backfill + download snapshot)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update_stats.py

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STATS.md docs/.stats-downloads.json
          if git diff --cached --quiet; then
            echo "no stats changes"
          else
            git commit -m "chore(stats): 일일 별점·다운로드 갱신"
            bash tools/open_automation_pr.sh \
              automation/stats \
              "chore(stats): 일일 별점·다운로드 갱신"
          fi
