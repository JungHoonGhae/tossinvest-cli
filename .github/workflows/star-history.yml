name: star-history

# star-history.com 무료 API 가 이 repo 스타 데이터 접근을 제한하는 문제 때문에,
# 실제 stargazer 타임스탬프로 SVG 차트를 직접 생성해 repo 에 커밋한다.
on:
  schedule:
    - cron: "0 0,12 * * *"   # 매일 09:00 · 21:00 KST (하루 2회)
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - name: Regenerate star-history charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/gen_star_history.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "$(git status --porcelain docs/assets/star-history)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/assets/star-history
            git commit -m "chore: star-history 차트 자동 갱신"
            bash tools/open_automation_pr.sh \
              automation/star-history \
              "chore: star-history 차트 자동 갱신"
          else
            echo "no change"
          fi
