name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Go tests
        run: go test ./...

      # gofmt + go vet, same target contributors run locally.
      - name: Lint
        run: make lint

      - name: Build CLI
        run: make build

      - name: Check auth helper syntax
        run: python -m compileall auth-helper

      - name: WTS 카탈로그 분류기 sanity
        run: python -m py_compile tools/wts_endpoints.py tools/update_new_markers.py

      # 카탈로그는 "무엇을 구현했고 무엇이 다음 후보인가" 의 단일 진실 원천이라
      # 도구가 틀리면 잘못된 판단이 연쇄된다. 실제로 2026-08 에 두 번 났다
      # (실재 경로 삭제, 실행마다 다른 결과). py_compile 은 문법만 본다.
      #
      # 해시 시드를 바꿔 두 번 돌린다 — 비결정성 사고가 프로세스 간 차이였다.
      - name: 카탈로그 도구 테스트
        run: |
          PYTHONHASHSEED=0 python3 -m unittest discover -s tools/tests
          PYTHONHASHSEED=1 python3 -m unittest discover -s tools/tests

      - name: 카탈로그 스윕 병합 테스트
        run: node --test tools/tests/*.test.mjs
