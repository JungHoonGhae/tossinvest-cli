name: Refresh Automation PRs

# Strict required checks go stale after another PR lands. Refresh only the
# allowlisted, bot-authored data PRs; never loosen main's ruleset.
on:
  push:
    branches: [main]
  # GITHUB_TOKEN auto-merges do not emit follow-up push workflow runs.
  # Recover stale bot PRs within six hours without workflow_run chains.
  schedule:
    - cron: '43 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  pending:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      families: ${{ steps.list.outputs.families }}
    steps:
      - name: Find pending bot data families without checkout
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          families="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --limit 100 \
            --json headRefName,author,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false and (.author.login == "app/github-actions" or .author.login == "github-actions[bot]")) | .headRefName | capture("^automation/(?<family>repository-metadata|wts-monitor|daily-monitor)(?:-[a-z0-9-]+)?$").family] | unique')"
          echo "families=$(jq -c . <<< "$families")" >> "$GITHUB_OUTPUT"
  refresh:
    needs: pending
    if: needs.pending.outputs.families != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.pending.outputs.families) }}
    concurrency:
      group: automation-${{ matrix.family }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - name: Refresh existing data PR and its attached checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAMILY: ${{ matrix.family }}
        run: |
          bash tools/open_automation_pr.sh --prepare "automation/$FAMILY"
          bash tools/open_automation_pr.sh "automation/$FAMILY" "chore($FAMILY): 자동 갱신"
