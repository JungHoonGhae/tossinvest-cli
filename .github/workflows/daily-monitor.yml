name: Daily Monitor

on:
  schedule:
    - cron: '0 10,22 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: PR list (24h)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title,author,createdAt,updatedAt,additions,deletions \
            --jq "map(select(.createdAt >= \"$CUTOFF\" or .updatedAt >= \"$CUTOFF\"))" \
            > /tmp/prs.json
          cat /tmp/prs.json

      - name: 핵심 API probe
        id: api
        run: |
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            'https://wts-info-api.tossinvest.com/api/v2/stock-infos/A005930' || echo ERR)
          echo "$CODE" > /tmp/api_status
          echo "code=$CODE"

      - name: 토스 Open API 페이지 모니터
        id: toss
        run: |
          # 공식 OpenAPI spec 직접 추적. version + endpoint 목록 hash + 전체 내용 hash.
          # 전체 spec 을 레포에 저장해 내부(파라미터·스키마·응답) 변경도 git diff 로 보이게 한다.
          SPEC_URL="https://openapi.tossinvest.com/openapi-docs/latest/openapi.json"
          SPEC_FILE=docs/migration/openapi.latest.json
          SPEC=$(curl -sS --max-time 15 "$SPEC_URL" || true)
          if [ -n "$SPEC" ] && printf '%s' "$SPEC" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$SPEC" | jq -S . > /tmp/spec_norm.json
            VERSION=$(jq -r '.info.version // ""' /tmp/spec_norm.json)
            PATH_COUNT=$(jq '.paths | keys | length' /tmp/spec_norm.json)
            PATHS_SHA=$(jq -S '.paths | keys' /tmp/spec_norm.json | shasum -a 256 | cut -d' ' -f1)
            FULL_SHA=$(shasum -a 256 /tmp/spec_norm.json | cut -d' ' -f1)
          else
            VERSION=""
            PATH_COUNT=0
            PATHS_SHA=""
            FULL_SHA=""
          fi

          # 실시간(웹소켓) 스펙은 REST 와 별개 문서이고 info.version 도 독립으로 굴러간다
          # (2026-08-19 신설). REST 해시만 보면 실시간 스펙 변경이 통째로 안 보인다.
          ASYNC_URL="https://openapi.tossinvest.com/openapi-docs/latest/asyncapi.json"
          ASYNC_FILE=docs/migration/asyncapi.latest.json
          ASYNC=$(curl -sS --max-time 15 "$ASYNC_URL" || true)
          if [ -n "$ASYNC" ] && printf '%s' "$ASYNC" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$ASYNC" | jq -S . > /tmp/asyncapi_norm.json
            ASYNC_VERSION=$(jq -r '.info.version // ""' /tmp/asyncapi_norm.json)
            ASYNC_SHA=$(shasum -a 256 /tmp/asyncapi_norm.json | cut -d' ' -f1)
          else
            ASYNC_VERSION=""
            ASYNC_SHA=""
          fi

          DOCS_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://developers.tossinvest.com/docs 2>/dev/null || echo ERR)
          LLMS_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://developers.tossinvest.com/llms.txt 2>/dev/null || echo ERR)

          SNAP=docs/migration/.openapi-snapshot.json
          BASE_VERSION=$(jq -r '.spec_version // ""' "$SNAP" 2>/dev/null || echo "")
          BASE_PATHS_SHA=$(jq -r '.spec_paths_sha256 // ""' "$SNAP" 2>/dev/null || echo "")
          BASE_PATH_COUNT=$(jq -r '.spec_path_count // 0' "$SNAP" 2>/dev/null || echo 0)
          BASE_FULL_SHA=$(jq -r '.spec_full_sha256 // ""' "$SNAP" 2>/dev/null || echo "")
          BASE_ASYNC_VERSION=$(jq -r '.asyncapi_version // ""' "$SNAP" 2>/dev/null || echo "")
          BASE_ASYNC_SHA=$(jq -r '.asyncapi_sha256 // ""' "$SNAP" 2>/dev/null || echo "")
          TODAY=$(date -u +%Y-%m-%d)

          REASONS=()
          CHANGED=false

          if [ -n "$VERSION" ] && [ "$VERSION" != "$BASE_VERSION" ]; then
            REASONS+=("🚨 spec version: \`${BASE_VERSION}\` → \`${VERSION}\`")
            CHANGED=true
          fi
          if [ -n "$PATHS_SHA" ] && [ "$PATHS_SHA" != "$BASE_PATHS_SHA" ]; then
            REASONS+=("🚨 endpoint 목록 변경 (${BASE_PATH_COUNT} → ${PATH_COUNT}개)")
            CHANGED=true
          fi
          # 전체 내용 변경 (경로/버전 동일해도 내부 파라미터·스키마 변경 감지)
          if [ -n "$FULL_SHA" ] && [ "$FULL_SHA" != "$BASE_FULL_SHA" ]; then
            if [ "$VERSION" = "$BASE_VERSION" ]; then
              REASONS+=("🔧 spec 내부 변경 (경로·버전 동일, 내용 변경 — openapi.latest.json diff 확인)")
            fi
            CHANGED=true
          fi
          if [ -n "$ASYNC_SHA" ] && [ "$ASYNC_SHA" != "$BASE_ASYNC_SHA" ]; then
            REASONS+=("🚨 실시간 AsyncAPI 스펙 변경: \`${BASE_ASYNC_VERSION:-없음}\` → \`${ASYNC_VERSION}\` (asyncapi.latest.json diff 확인)")
            CHANGED=true
          fi
          # spec fetch 실패는 일시 장애일 수 있어 변경으로 안 봄 (경고만)
          if [ -z "$VERSION" ]; then
            REASONS+=("⚠️ spec fetch 실패 (일시 장애 가능)")
          fi

          # snapshot 은 실제 내용 변경 시에만 커밋한다. (과거의 last_checked
          # heartbeat 커밋은 월 ~27개 노이즈만 만들어 제거 — 살아있음 증명은
          # Actions 실행 히스토리와 매일 Discord 알림으로 충분.)
          SNAP_DIRTY=false
          if $CHANGED && [ -n "$VERSION" ]; then
            cp /tmp/spec_norm.json "$SPEC_FILE"
            if [ -n "$ASYNC_SHA" ]; then cp /tmp/asyncapi_norm.json "$ASYNC_FILE"; fi
            jq -n --arg url "$SPEC_URL" --arg sf "$SPEC_FILE" --arg ver "$VERSION" --argjson pc "$PATH_COUNT" \
              --arg psha "$PATHS_SHA" --arg fsha "$FULL_SHA" --arg docs "$DOCS_CODE" --arg llms "$LLMS_CODE" \
              --arg ts "$TODAY" --arg lc "$TODAY" --arg aver "$ASYNC_VERSION" --arg asha "$ASYNC_SHA" \
              '{phase:"spec-public",spec_url:$url,spec_file:$sf,spec_version:$ver,spec_path_count:$pc,spec_paths_sha256:$psha,spec_full_sha256:$fsha,asyncapi_version:$aver,asyncapi_sha256:$asha,docs_url:"https://developers.tossinvest.com/docs",docs_status:$docs,llms_txt_status:$llms,updated_at:$ts,last_checked_at:$lc}' \
              > "$SNAP"
            printf '%s\n' "${REASONS[@]}" > /tmp/toss_reasons.txt
            SNAP_DIRTY=true
          else
            # 변화 없음(또는 일시 fetch 실패) — 커밋 없음. 확인 사실은 Discord 알림에만 남긴다.
            if [ ${#REASONS[@]} -gt 0 ]; then
              printf '%s\n' "${REASONS[@]}" > /tmp/toss_reasons.txt
            else
              echo "⚪️ 변화 없음 (spec \`${VERSION}\`, ${PATH_COUNT} endpoints, 확인 ${TODAY})" > /tmp/toss_reasons.txt
            fi
          fi
          echo "$CHANGED" > /tmp/toss_changed
          echo "$SNAP_DIRTY" > /tmp/snap_dirty
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > /tmp/toss_version
          echo "$PATH_COUNT" > /tmp/toss_pathcount

      - name: Compose embed
        run: |
          NOW_KST=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')
          API_CODE=$(cat /tmp/api_status)
          TOSS_CHANGED=$(cat /tmp/toss_changed)
          TOSS_REASONS=$(cat /tmp/toss_reasons.txt)
          PR_COUNT=$(jq 'length' /tmp/prs.json)
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"

          VER=$(cat /tmp/toss_version 2>/dev/null); PCOUNT=$(cat /tmp/toss_pathcount 2>/dev/null)
          SPEC_META="\`v${VER:-?}\` · ${PCOUNT:-?} endpoints"

          # PR: 최근 24h 열린·업데이트된 PR
          if [ "$PR_COUNT" = "0" ]; then
            PR_BLOCK="없음"
          else
            PR_BLOCK=$(jq -r --arg url "$REPO_URL" '.[] | "• [#\(.number)](\($url)/pull/\(.number)) \(.title) — **@\(.author.login)** `+\(.additions)/-\(.deletions)`"' /tmp/prs.json)
          fi

          # 핵심 API: 무인증 카나리 1개로 WTS 조회 API 살아있는지 확인
          if [ "$API_CODE" = "200" ]; then
            API_LINE="정상 · 카나리 \`stock-infos/A005930\` → 200"
          else
            API_LINE="이상 · status \`$API_CODE\` — 실제 회귀 또는 GitHub Actions IP 차단 (본인 머신 \`tossctl monitor api\` 로 확인)"
          fi

          # 공식 Open API spec: 버전·엔드포인트 수·전체 내용 해시 변동 추적
          if [ "$TOSS_CHANGED" = "false" ]; then
            TOSS_BLOCK="변동 없음 · ${SPEC_META}"
          else
            TOSS_BLOCK="변동 감지 · ${SPEC_META}"$'\n'"$(printf '%s\n' "$TOSS_REASONS" | sed 's/^/• /')"
          fi

          # 상태는 Container accent_color 로만 구분: 정상=초록 / 변경=주황 / API 장애=빨강
          if [ "$API_CODE" != "200" ]; then
            COLOR=15548997; TITLE="tossctl daily — 핵심 API 이상"
          elif [ "$PR_COUNT" != "0" ] || [ "$TOSS_CHANGED" = "true" ]; then
            COLOR=15105570; TITLE="tossctl daily — 확인할 변동 있음"
          else
            COLOR=3901789;  TITLE="tossctl daily — 모두 정상"
          fi

          # Discord Components V2 (flags 32768): Container(accent_color=상태색) 안에
          # 소개 1줄 + 각 점검 항목(뭘 보는지 + 현재 값) + issue 링크 버튼.
          trunc() { head -c 1400; }
          jq -n \
            --argjson color "$COLOR" \
            --arg title "## $TITLE" \
            --arg intro "-# 매일 2회 자동 점검 — 열린 PR · WTS 조회 API 헬스 · 공식 Open API spec 변동" \
            --arg pr   "**PR (24h)** — 최근 24h 열린·업데이트"$'\n'"$(printf '%s' "$PR_BLOCK"   | trunc)" \
            --arg api  "**핵심 API 헬스** — WTS 조회 API 생존 카나리"$'\n'"$(printf '%s' "$API_LINE"   | trunc)" \
            --arg toss "**공식 Open API spec** — 버전·엔드포인트·내용 추적"$'\n'"$(printf '%s' "$TOSS_BLOCK" | trunc)" \
            --arg foot "-# tossctl daily monitor · $NOW_KST KST · 전체 조회 API 헬스는 \`tossctl monitor api\`" \
            --arg issue "${REPO_URL}/issues/31" \
            '{flags:32768, components:[{
              type:17, accent_color:$color, components:[
                {type:10, content:$title},
                {type:10, content:$intro},
                {type:14},
                {type:10, content:$pr},
                {type:10, content:$api},
                {type:10, content:$toss},
                {type:14},
                {type:10, content:$foot},
                {type:1, components:[
                  {type:2, style:5, label:"issue #31", url:$issue}
                ]}
              ]
            }]}' > /tmp/payload.json
          echo "--- payload ---"; cat /tmp/payload.json

      - name: Send Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK secret 미설정"
            exit 1
          fi
          # Components V2 는 웹훅이 with_components=true 일 때만 존중한다 (없으면 드롭 → 50006)
          SEP='?'; case "$WEBHOOK" in *\?*) SEP='&';; esac
          HTTP=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data @/tmp/payload.json "${WEBHOOK}${SEP}with_components=true")
          echo "Discord status: $HTTP"
          cat /tmp/resp || true
          [ "$HTTP" = "204" ] || exit 1

      - name: Commit snapshot (실제 spec 변경 시에만)
        if: hashFiles('docs/migration/.openapi-snapshot.json') != ''
        run: |
          if [ "$(cat /tmp/snap_dirty 2>/dev/null)" != "true" ]; then
            echo "갱신할 내용 없음 — commit skip"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/migration/.openapi-snapshot.json docs/migration/openapi.latest.json docs/migration/asyncapi.latest.json
          git diff --cached --quiet && { echo "이미 최신"; exit 0; }
          git commit -m "docs(migration): openapi-snapshot 자동 갱신"

      - name: 지원 범위 🆕 마커 자동 갱신 (롤링 30일 윈도우)
        run: |
          python3 tools/update_new_markers.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website-fumadocs/content/docs/reference/support-scope.mdx website-fumadocs/content/docs/reference/support-scope.en.mdx
          git diff --cached --quiet && { echo "🆕 마커 최신"; exit 0; }
          git commit -m "docs(scope): 🆕 마커 자동 갱신 (최근 한 달 윈도우) [skip ci]"

      - name: Open protected automation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/open_automation_pr.sh \
            automation/daily-monitor \
            "chore(monitor): 공식 API 스냅샷·지원 범위 자동 갱신"

      # API 변경의 AI 해석은 공개 저장소에 self-hosted runner를 연결하지 않기 위해
      # 소유자 Mac의 Codex 예약 작업 또는 launchd + ChatGPT 로그인된 Codex CLI가 수행한다.
      # 두 스케줄러를 동시에 켜지 않는다. 도구와 설치 절차: docs/operations.md.
